<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="140" fill="#2563eb" opacity="0.1"/>
  <circle cx="100" cy="380" r="180" fill="#3b82f6" opacity="0.08"/>
  
  <!-- Newspaper Icon -->
  <g transform="translate(350, 150)">
    <rect x="-50" y="-40" width="100" height="80" rx="10" fill="#334155" stroke="#475569" stroke-width="3"/>
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-30" y1="-5" x2="30" y2="-5" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-30" y1="10" x2="10" y2="10" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="15" r="8" fill="#3b82f6"/>
  </g>
  
  <text x="400" y="270" text-anchor="middle" fill="#f8fafc" font-family="'Poppins', sans-serif" font-size="24" font-weight="600" letter-spacing="1">
    NEWSPOT
  </text>
  <text x="400" y="305" text-anchor="middle" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="14">
    Verified Daily Headlines
  </text>
</svg>
